name: 非商业衍生版本申请 / Derivative release
description: 申请独立发行修改后的 Runtime 版本
title: "[Derivative] "
labels: ["application:derivative"]
body:
  - type: input
    id: repository
    attributes:
      label: 独立项目名称与源码仓库 URL
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: 上游提交或版本、申请发行的版本范围
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 用途、用户、分发方式与收入情况
      description: 请说明收费、广告、捐赠、商业研发或企业生产用途；没有也请明确说明。
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: 修改内容、构建说明、测试及维护计划
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 许可条件
      options:
        - label: 我接受 LICENSE 和 FORK_POLICY.md，并保留版权与许可声明。
          required: true
        - label: 我会公开对应修改源码和构建说明，使用独立名称，不声称官方认证。
          required: true
        - label: 我理解必须取得明确书面认可后才能独立发行，标签或沉默不等于认可。
          required: true
